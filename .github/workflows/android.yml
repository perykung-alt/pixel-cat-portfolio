name: แอป Android (APK)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "PortfolioWidget.js"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Sprites (จากสคริปต์ iPhone ตัวเดียวกัน)
        run: node -e "const fs=require('fs');const m=fs.readFileSync('PortfolioWidget.js','utf8').match(/^const SPR = (\{.*\});$/m);fs.writeFileSync('android/app/src/main/assets/sprites.json',m[1])"
      - name: Keystore
        id: ks
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::warning title=ยังไม่มี Secret::ยังไม่ได้ใส่ ANDROID_KEYSTORE_B64 — สร้างแบบ debug เพื่อตรวจโค้ดเท่านั้น ไม่ปล่อย APK"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "$B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> $GITHUB_ENV
            echo "release=true" >> $GITHUB_OUTPUT
          fi
      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          TASK=assembleDebug; [ "${{ steps.ks.outputs.release }}" = "true" ] && TASK=assembleRelease
          set +e
          gradle $TASK --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            msg=$( (grep -E "^e: |error:|What went wrong|Could not|Caused by|> " build.log | grep -v "^> Task" | head -n 40) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
      - name: Rename APK
        if: steps.ks.outputs.release == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pixel-cat.apk
          echo "VNAME=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        if: steps.ks.outputs.release == 'true'
        with:
          tag_name: android-v${{ env.VNAME }}
          name: Pixel Cat Android v${{ env.VNAME }}
          body: |
            ดาวน์โหลด pixel-cat.apk แล้วเปิดเพื่อติดตั้ง (ครั้งแรกต้องกดอนุญาต "ติดตั้งแอปที่ไม่รู้จัก")
            จากนั้นกดค้างที่หน้าจอหลัก → วิดเจ็ต → Pixel Cat พอร์ต
          files: pixel-cat.apk
          make_latest: true
